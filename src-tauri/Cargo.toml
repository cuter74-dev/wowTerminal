[package]
name = "wowterminal"
version = "0.3.0"
description = "AI Terminal with multi-backend AI (cloud/local/self-hosted) and SSH manager"
authors = ["cuter74-dev"]
license = "MIT"
edition = "2021"

[lib]
name = "wowterminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
base64 = "0.22"
toml = "0.8"
portable-pty = "0.9"
russh = "0.61"
dirs = "5"
tempfile = "3"
russh-sftp = "2"
ssh-key = { version = "=0.7.0-rc.10", features = ["ed25519", "rsa", "encryption"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
machine-uid = "0.6.0"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full", "macros", "test-util"] }

