[package]
name = "wowterminal"
version = "0.1.0"
description = "AI Terminal with multi-backend AI (cloud/local/self-hosted) and SSH manager"
authors = ["cuter74-dev"]
edition = "2021"

[lib]
name = "wowterminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

