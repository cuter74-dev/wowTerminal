name: release

# v로 시작하는 태그를 push하면 멀티플랫폼 설치 파일을 빌드해 GitHub Release(초안)에 첨부한다.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

# 번들 액션(checkout/setup-node 등)을 Node 24 런타임으로 강제.
# GitHub은 2026-06-02부터 Node 20 액션을 Node 24로 전환한다 — 미리 opt-in해 경고 제거.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS는 universal 빌드를 위해 두 타깃 모두 설치.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- 자동 업데이트 서명 (tauri-plugin-updater) ---
          # GitHub Secret TAURI_SIGNING_PRIVATE_KEY에 비밀키 내용을 등록하면
          # 빌드 시 업데이트 아티팩트(.sig)와 latest.json이 서명·생성된다. 비밀번호는 빈 값.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- 코드 서명(macOS/Windows)은 현재 미사용(unsigned 배포) ---
          # Apple Developer 인증서를 발급하면 아래 env를 다시 추가해 서명·공증한다.
          # (절차: docs/guide/release-signing.md)
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY /
          #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "wowTerminal ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your platform from the assets below.

            Builds are unsigned, so the OS may warn on first launch:
            - macOS: right-click the app → Open (or System Settings → Privacy & Security → Open Anyway).
            - Windows: SmartScreen → More info → Run anyway.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
